<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tally — Ledger</title>
    <link rel="stylesheet" href="tally.css" />
  </head>
  <body>
    <header class="nav"></header>
    <main>
      <h1>Ledger</h1>
      <p class="subtitle">
        Append-only double entry. Balances are derived (SUM over entries), never stored.
      </p>

      <div class="card">
        <h2>Accounts <span id="verdict"></span></h2>
        <div class="scroll-x">
          <table>
            <thead>
              <tr>
                <th>Account</th>
                <th>Currency</th>
                <th class="num">Derived balance</th>
              </tr>
            </thead>
            <tbody id="accounts"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Transactions</h2>
        <div class="scroll-x">
          <table>
            <thead>
              <tr>
                <th>Posted</th>
                <th>Kind</th>
                <th>Intent</th>
                <th>Entries (debit → credit)</th>
              </tr>
            </thead>
            <tbody id="transactions"></tbody>
          </table>
        </div>
        <div class="pager">
          <button id="prev">← Prev</button>
          <button id="next">Next →</button>
          <span id="page-note"></span>
        </div>
      </div>
    </main>

    <script type="module">
      import { api, autoRefresh, esc, money, renderNav, ts } from './tally.js';

      renderNav('ledger.html');

      const LIMIT = 20;
      let offset = 0;

      async function refresh() {
        const [accounts, transactions] = await Promise.all([
          api('/v1/accounts'),
          api(`/v1/ledger_transactions?limit=${LIMIT}&offset=${offset}`),
        ]);

        if (accounts.body) {
          document.getElementById('accounts').innerHTML =
            accounts.body.accounts
              .map(
                (a) => `<tr>
                  <td class="mono">${esc(a.type)}</td>
                  <td>${esc(a.currency)}</td>
                  <td class="num mono">${money(a.balance_minor, a.currency)}</td>
                </tr>`,
              )
              .join('') +
            `<tr><td colspan="2"><strong>sum of all accounts</strong></td>
             <td class="num mono"><strong>${money(accounts.body.total_minor)}</strong></td></tr>`;
          document.getElementById('verdict').innerHTML =
            accounts.body.total_minor === '0'
              ? '<span class="chip" data-tone="ok">sums to 0</span>'
              : `<span class="chip" data-tone="bad">sum ${esc(accounts.body.total_minor)}</span>`;
        }

        if (transactions.body) {
          const { transactions: txs, total } = transactions.body;
          document.getElementById('transactions').innerHTML =
            txs.length === 0
              ? '<tr><td colspan="4" class="muted">no transactions yet</td></tr>'
              : txs
                  .map(
                    (t) => `<tr>
                      <td class="muted small">${ts(t.posted_at)}</td>
                      <td><span class="chip" data-tone="info">${esc(t.kind)}</span></td>
                      <td class="mono small">
                        <a href="intents.html#${esc(t.intent_id)}">${esc(t.intent_id)}</a>
                      </td>
                      <td class="mono small">${t.entries
                        .map(
                          (e) =>
                            `${e.direction === 'debit' ? 'dr' : 'cr'} ${esc(e.account_type)} ${money(e.amount_minor)}`,
                        )
                        .join('<br>')}</td>
                    </tr>`,
                  )
                  .join('');
          document.getElementById('page-note').textContent =
            total === 0 ? '' : `${offset + 1}–${Math.min(offset + LIMIT, total)} of ${total}`;
          document.getElementById('prev').disabled = offset === 0;
          document.getElementById('next').disabled = offset + LIMIT >= total;
        }
      }

      document.getElementById('prev').onclick = () => {
        offset = Math.max(0, offset - LIMIT);
        refresh();
      };
      document.getElementById('next').onclick = () => {
        offset += LIMIT;
        refresh();
      };

      autoRefresh(refresh, 3000);
    </script>
  </body>
</html>
