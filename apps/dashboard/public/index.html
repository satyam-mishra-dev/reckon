<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tally — Overview</title>
    <link rel="stylesheet" href="tally.css" />
  </head>
  <body>
    <header class="nav"></header>
    <main>
      <h1>Overview</h1>
      <p class="subtitle">Live read model over the engine's tables. Auto-refreshes every 2.5s.</p>

      <div class="grid">
        <div class="card">
          <h2>Payment intents</h2>
          <div id="intents"></div>
        </div>
        <div class="card">
          <h2>Webhook deliveries</h2>
          <div id="deliveries"></div>
        </div>
        <div class="card">
          <h2>Last reconciliation</h2>
          <div id="reconciliation"></div>
        </div>
      </div>

      <div class="card">
        <h2>Ledger balances <span id="ledger-verdict"></span></h2>
        <div class="scroll-x">
          <table>
            <thead>
              <tr>
                <th>Account</th>
                <th class="num">Balance</th>
              </tr>
            </thead>
            <tbody id="balances"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module">
      import { api, autoRefresh, chip, esc, money, renderNav, ts } from './tally.js';

      renderNav('index.html');

      const INTENT_ORDER = ['created', 'processing', 'requires_retry', 'succeeded', 'failed'];
      const DELIVERY_ORDER = ['pending', 'delivered', 'dead'];

      function statRows(byStatus, order) {
        const rows = order
          .filter((s) => byStatus[s] !== undefined)
          .map(
            (s) =>
              `<div class="stat-row">${chip(s)}<span class="value">${byStatus[s]}</span></div>`,
          );
        return rows.length > 0 ? rows.join('') : '<p class="muted">none yet</p>';
      }

      async function refresh() {
        const { status, body } = await api('/v1/stats');
        if (status !== 200 || body === null) return;

        const intents = body.intents_by_status;
        const total = Object.values(intents).reduce((a, b) => a + b, 0);
        document.getElementById('intents').innerHTML =
          `<div class="big-number">${total}</div>` + statRows(intents, INTENT_ORDER);

        const deliveries = body.deliveries_by_status;
        const dTotal = Object.values(deliveries).reduce((a, b) => a + b, 0);
        document.getElementById('deliveries').innerHTML =
          `<div class="big-number">${dTotal}</div>` +
          statRows(deliveries, DELIVERY_ORDER) +
          `<div class="stat-row"><span class="muted small">events dispatched</span>` +
          `<span class="value">${body.events.dispatched}/${body.events.total}</span></div>`;

        const r = body.last_reconciliation;
        document.getElementById('reconciliation').innerHTML =
          r === null
            ? '<p class="muted">no pass yet — the worker runs one every minute</p>'
            : `<div class="big-number">${
                r.drift_minor === '0'
                  ? '<span class="chip" data-tone="ok" style="font-size:15px">drift 0</span>'
                  : `<span class="chip" data-tone="bad" style="font-size:15px">drift ${esc(r.drift_minor)}</span>`
              }</div>
              <div class="stat-row"><span class="muted small">violations</span><span class="value">${r.internal_violations}</span></div>
              <div class="stat-row"><span class="muted small">orphans found / resolved</span><span class="value">${r.orphans_found} / ${r.orphans_resolved}</span></div>
              <div class="stat-row"><span class="muted small">critical flags</span><span class="value">${r.flagged_critical}</span></div>
              <div class="muted small">${ts(r.finished_at)} · ${r.duration_ms}ms</div>`;

        document.getElementById('balances').innerHTML =
          body.balances
            .map(
              (b) =>
                `<tr><td class="mono">${esc(b.type)}</td>
                 <td class="num mono">${money(b.balance_minor)}</td></tr>`,
            )
            .join('') +
          `<tr><td><strong>sum of all accounts</strong></td>
           <td class="num mono"><strong>${money(body.ledger_total_minor)}</strong></td></tr>`;
        document.getElementById('ledger-verdict').innerHTML =
          body.ledger_total_minor === '0'
            ? '<span class="chip" data-tone="ok">sums to 0 — double entry holds</span>'
            : `<span class="chip" data-tone="bad">sum ${esc(body.ledger_total_minor)} — drift!</span>`;
      }

      autoRefresh(refresh);
    </script>
  </body>
</html>
