<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tally — Intents</title>
    <link rel="stylesheet" href="tally.css" />
  </head>
  <body>
    <header class="nav"></header>
    <main>
      <div id="list-view">
        <h1>Payment intents</h1>
        <p class="subtitle">Newest first. Click a row for the full trail.</p>
        <div class="card">
          <div class="seg-group" id="filters"></div>
          <div class="scroll-x" style="margin-top: 14px">
            <table>
              <thead>
                <tr>
                  <th>Intent</th>
                  <th class="num">Amount</th>
                  <th>Status</th>
                  <th>Provider ref</th>
                  <th>Failure</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager">
            <button id="prev">← Prev</button>
            <button id="next">Next →</button>
            <span id="page-note"></span>
          </div>
        </div>
      </div>

      <div id="detail-view" hidden>
        <h1 class="mono" id="detail-title"></h1>
        <p class="subtitle"><a href="intents.html">← back to all intents</a></p>
        <div class="card" id="detail-summary"></div>
        <div class="card">
          <h2>Idempotency recovery point</h2>
          <div id="detail-trail"></div>
        </div>
        <div class="card">
          <h2>Timeline</h2>
          <ul class="timeline" id="detail-timeline"></ul>
        </div>
        <div class="card">
          <h2>Ledger postings</h2>
          <div id="detail-ledger"></div>
        </div>
        <div class="card">
          <h2>Webhook deliveries</h2>
          <div id="detail-deliveries"></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { api, autoRefresh, chip, esc, money, renderNav, shortId, ts } from './tally.js';

      renderNav('intents.html');

      const STATUSES = ['all', 'created', 'processing', 'requires_retry', 'succeeded', 'failed'];
      const RECOVERY_POINTS = [
        'started',
        'intent_created',
        'provider_charged',
        'ledger_posted',
        'finished',
      ];
      const LIMIT = 25;
      let filter = 'all';
      let offset = 0;

      // ---- list view --------------------------------------------------------

      function renderFilters() {
        document.getElementById('filters').innerHTML = STATUSES.map(
          (s) =>
            `<button class="seg${s === filter ? ' active' : ''}" data-status="${s}">${s}</button>`,
        ).join('');
        for (const button of document.querySelectorAll('#filters button')) {
          button.onclick = () => {
            filter = button.dataset.status;
            offset = 0;
            renderFilters();
            refreshList();
          };
        }
      }

      async function refreshList() {
        const query = filter === 'all' ? '' : `&status=${filter}`;
        const { body } = await api(`/v1/payment_intents?limit=${LIMIT}&offset=${offset}${query}`);
        if (!body) return;
        document.getElementById('rows').innerHTML =
          body.intents.length === 0
            ? '<tr><td colspan="6" class="muted">no intents yet — try the playground</td></tr>'
            : body.intents
                .map(
                  (i) => `<tr class="clickable" data-id="${esc(i.id)}">
                    <td class="mono">${esc(i.id)}</td>
                    <td class="num mono">${money(i.amount_minor, i.currency)}</td>
                    <td>${chip(i.status)}</td>
                    <td class="mono muted">${esc(shortId(i.provider_ref ?? '', 14))}</td>
                    <td class="mono muted">${esc(i.failure_code ?? '')}</td>
                    <td class="muted small">${ts(i.created_at)}</td>
                  </tr>`,
                )
                .join('');
        for (const row of document.querySelectorAll('#rows tr.clickable')) {
          row.onclick = () => {
            location.hash = row.dataset.id;
          };
        }
        document.getElementById('page-note').textContent =
          `${offset + 1}–${Math.min(offset + LIMIT, body.total)} of ${body.total}`;
        document.getElementById('prev').disabled = offset === 0;
        document.getElementById('next').disabled = offset + LIMIT >= body.total;
      }

      document.getElementById('prev').onclick = () => {
        offset = Math.max(0, offset - LIMIT);
        refreshList();
      };
      document.getElementById('next').onclick = () => {
        offset += LIMIT;
        refreshList();
      };

      // ---- detail view ------------------------------------------------------

      function trail(current) {
        const reachedIdx = RECOVERY_POINTS.indexOf(current);
        return `<div class="trail">${RECOVERY_POINTS.map((p, i) => {
          const cls = i === reachedIdx ? 'current' : i < reachedIdx ? 'reached' : '';
          return `<span class="step ${cls}">${p}</span>${
            i < RECOVERY_POINTS.length - 1 ? '<span class="arrow">→</span>' : ''
          }`;
        }).join('')}</div>`;
      }

      async function refreshDetail(id) {
        const { status, body } = await api(`/v1/payment_intents/${id}`);
        if (status === 404) {
          document.getElementById('detail-summary').innerHTML =
            '<p class="muted">intent not found</p>';
          return;
        }
        if (!body) return;
        const { intent, idempotency_key: key, transactions, events, deliveries } = body;

        document.getElementById('detail-title').textContent = intent.id;
        document.getElementById('detail-summary').innerHTML = `
          <div class="stat-row"><span class="muted">status</span>${chip(intent.status)}</div>
          <div class="stat-row"><span class="muted">amount</span><span class="mono">${money(intent.amount_minor, intent.currency)}</span></div>
          <div class="stat-row"><span class="muted">provider ref</span><span class="mono">${esc(intent.provider_ref ?? '—')}</span></div>
          ${intent.failure_code ? `<div class="stat-row"><span class="muted">failure code</span><span class="mono">${esc(intent.failure_code)}</span></div>` : ''}
          <div class="stat-row"><span class="muted">created</span><span class="small">${ts(intent.created_at)}</span></div>
          <div class="stat-row"><span class="muted">updated</span><span class="small">${ts(intent.updated_at)}</span></div>`;

        document.getElementById('detail-trail').innerHTML =
          key === null
            ? '<p class="muted">no idempotency key (created outside the API?)</p>'
            : trail(key.recovery_point) +
              `<p class="muted small">key <span class="mono">${esc(key.key)}</span>
               · stored response ${key.response_code ?? 'none yet'}
               · ${key.locked_at ? `locked at ${ts(key.locked_at)}` : 'not locked'}</p>`;

        const timeline = [
          ...events.map((e) => ({
            at: e.created_at,
            html: `<strong class="mono">${esc(e.type)}</strong>
              ${e.payload.event ? `<span class="muted small">via ${esc(e.payload.event)}</span>` : ''}
              ${e.dispatched_at ? '' : ' <span class="chip" data-tone="warn">undispatched</span>'}`,
          })),
          ...transactions.map((t) => ({
            at: t.posted_at,
            html: `<strong>ledger ${esc(t.kind)} posted</strong> <span class="muted small mono">${esc(shortId(t.id, 8))}</span>`,
          })),
        ].sort((a, b) => new Date(a.at) - new Date(b.at));
        document.getElementById('detail-timeline').innerHTML =
          timeline.length === 0
            ? '<li>nothing yet</li>'
            : timeline.map((t) => `<li><div class="when">${ts(t.at)}</div>${t.html}</li>`).join('');

        document.getElementById('detail-ledger').innerHTML =
          transactions.length === 0
            ? '<p class="muted">no postings (only succeeded intents post to the ledger)</p>'
            : transactions
                .map(
                  (t) => `<h2 style="margin-top:10px">${esc(t.kind)}
                    <span class="muted small">${ts(t.posted_at)}</span></h2>
                  <table><tbody>${t.entries
                    .map(
                      (e) => `<tr>
                        <td class="mono">${esc(e.account_type)}</td>
                        <td>${e.direction === 'debit' ? 'debit' : 'credit'}</td>
                        <td class="num mono">${money(e.amount_minor)}</td>
                      </tr>`,
                    )
                    .join('')}</tbody></table>`,
                )
                .join('');

        document.getElementById('detail-deliveries').innerHTML =
          deliveries.length === 0
            ? '<p class="muted">no deliveries yet</p>'
            : `<div class="scroll-x"><table>
                <thead><tr><th>Event</th><th>Status</th><th class="num">Attempts</th><th class="num">Last code</th><th>URL</th></tr></thead>
                <tbody>${deliveries
                  .map((d) => {
                    const event = events.find((e) => e.id === d.event_id);
                    return `<tr>
                      <td class="mono small">${esc(event?.type ?? d.event_id)}</td>
                      <td>${chip(d.status)}</td>
                      <td class="num">${d.attempt}</td>
                      <td class="num">${d.last_response_code ?? '—'}</td>
                      <td class="muted small">${esc(d.url)}</td>
                    </tr>`;
                  })
                  .join('')}</tbody></table></div>`;
      }

      // ---- routing: #<intent-id> shows the detail view ----------------------

      let timer = null;
      function route() {
        clearInterval(timer);
        const id = location.hash.slice(1);
        const detail = id.length > 0;
        document.getElementById('list-view').hidden = detail;
        document.getElementById('detail-view').hidden = !detail;
        timer = autoRefresh(() => (detail ? refreshDetail(id) : refreshList()), 2500);
      }

      window.addEventListener('hashchange', route);
      renderFilters();
      route();
    </script>
  </body>
</html>
